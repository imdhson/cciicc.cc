<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{.Sp_name}} - {{.Service_name}}</title>
  <style>
    @import url('/assets/content.css');
  </style>
  <script src="/assets/content.js" />
  </script>
</head>

<body onload="space_content_onload('/')"> <!-- 템플릿엔진 에러 무시 -->

  <section class="bodysection">
    <header>
      <a href="/">
      <h1>{{.Sp_name}}</h1></a>
      <a href="/">
        <h3>/
      </a><b onclick="linkCopyToClipboard('{{.Sp_id}}')">{{.Sp_id}}</b></h3>
      <p id="content_view_count">{{.Sp_view}}</p>
      <p>{{.Content_view_count}}</p>
      <img id="QRsmall" src="{{.Sp_png_path}}" onclick="qrsmallClick()" alt="공간 접속 QR 코드" />
    </header>
    <main>
      <section id="comments">
      </section>
    </main>
    <form id="comment_form" onsubmit="return false;">
      <input type="text" id="comment" name="chat" placeholder="{{.User_name}}:" aria-label="채팅 메시지 입력" autofocus
        onkeypress="addComment_form(event)" required>
      <select name="color">
        <option value="-1">⬜️ white</option>
        <option value="0">🟧 orange</option>
        <option value="1">🩵 skyblue</option>
        <option value="2">🟩 green</option>
        <option value="3">💗 pink</option>
        <option value="4">🟥 red</option>
        <option value="5">🟦 blue</option>
      </select>
      <button type="button" onclick="addComment_form(-1)">{{.Content_send}}</button>
    </form>
    <footer>
      <a href="/assets/terms.html">
        <p>{{.Footer_terms}}</p>
      </a>
    </footer>
  </section>
</body>

</html>
