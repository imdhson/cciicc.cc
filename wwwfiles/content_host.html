<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{.Sp_name}} - {{.Service_name}}</title>
  <style>
    @import url('{{.Url_address}}/assets/content.css');
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
</head>

<body onload="space_content_onload({{.Url_address}})">
  <header>
    <a href="{{.Url_address}}">
      <h1>{{.Sp_name}}</h1>
    </a>
    <a href="{{.Url_address}}">
      <h3>{{.Url_address}}/
    </a><b onclick="linkCopyToClipboard('{{.Sp_id}}')">{{.Sp_id}}</b></h3>
    <p id="content_view_count">{{.Sp_view}}</p>
    <p>{{.Content_view_count}}</p>
    <img id="QRsmall" src="{{.Sp_png_path}}" onclick="qrsmallClick()" />
  </header>

  <div class="content-wrapper">
    <main>
      <div class="upload-container">
        <button id="uploadToggle" onclick="uploadToggle_onclick()">업로드 열기</button>
        <div id="uploadArea" class="form-floating">
          <input type="file" id="fileInput" placeholder=" ">
          <button id="uploadButton" onclick="uploadPDF()">업로드</button>
        </div>
      </div>
      <div id="pdf-viewer">
        <div id="pdf-controls">
          <button id="prev-page" onclick="onPrevPage()">이전</button>
          <span id="page-num"></span>
          <button id="next-page" onclick="onNextPage()">다음</button>
        </div>
        <canvas id="pdf-render"></canvas>
      </div>
    </main>

    <form id="comment_form" onsubmit="return false;">
      <input type="text" id="comment" name="chat" placeholder="{{.User_name}}:" autofocus
        onkeypress="addComment_form(event)" required>
      <button type="button" onclick="addComment_form(-1)">{{.Content_send}}</button>
    </form>
  </div>

  <footer>
    <a href="{{.Url_address}}/assets/terms.html">
      <p>{{.Footer_terms}}</p>
    </a>
  </footer>
  <div id="overlay"></div>
  <div id="popup"></div>
</body>
<script src="{{.Url_address}}/assets/content.js"></script>
<script>ImHost()</script>

</html>
