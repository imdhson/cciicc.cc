<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="csrf-token" content="{{.CsrfToken}}">
  <title>{{.Sp_name}} - {{.Service_name}}</title>
  <style>
    @import url('/assets/content.css');
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
</head>

<body onload="space_content_onload('')">
  <header>
    <a href="/">
      <h1>{{.Sp_name}}</h1>
    </a>
    <a href="/">
      <h3>/
    </a><b onclick="linkCopyToClipboard('{{.Sp_id}}')">{{.Sp_id}}</b></h3>
    <p id="content_view_count">{{.Sp_view}}</p>
    <p>{{.Content_view_count}}</p>
    <img id="QRsmall" src="{{.Sp_png_path}}" onclick="qrsmallClick()" alt="공간 접속 QR 코드" />
  </header>

  <div class="content-wrapper">
    <main>
      <div id="pdf-viewer">
        <div id="pdf-controls">
          <button id="prev-page" onclick="onPrevPage()">이전</button>
          <span id="page-num"></span>
          <button id="next-page" onclick="onNextPage()">다음</button>
        </div>
        <canvas id="pdf-render"></canvas>
      </div>
      <div id="media-viewer" style="display: none;">
        <!-- Media content will be loaded here -->
      </div>
    </main>

    <div id="emoji-container" style="display: flex; justify-content: center; gap: 10px; margin-bottom: 10px;">
      <button type="button" onclick="sendEmoji('👍')" class="emoji-btn" aria-label="좋아요">👍</button>
      <button type="button" onclick="sendEmoji('❤️')" class="emoji-btn" aria-label="하트">❤️</button>
      <button type="button" onclick="sendEmoji('👏')" class="emoji-btn" aria-label="박수">👏</button>
      <button type="button" onclick="sendEmoji('❓')" class="emoji-btn" aria-label="질문">❓</button>
      <button type="button" onclick="sendEmoji('😂')" class="emoji-btn" aria-label="웃음">😂</button>
    </div>
    <form id="comment_form" onsubmit="return false;">
      <input type="text" id="comment" name="chat" placeholder="{{.User_name}}:" aria-label="채팅 메시지 입력" autofocus
        onkeypress="addComment_form(event)" required>
      <button type="button" onclick="addComment_form(-1)">{{.Content_send}}</button>
    </form>
  </div>

  <footer>
    <a href="/assets/terms.html">
      <p>{{.Footer_terms}}</p>
    </a>
  </footer>
  <div id="overlay"></div>
  <div id="popup"></div>
  <div id="message-container"></div>
</body>
<script src="/assets/content.js"></script>

</html>
