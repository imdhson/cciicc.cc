<!DOCTYPE html>

<html>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{.Service_name}}</title>
  <style>
    @import url('/assets/main.css');
  </style>
</head>

<body>
  <section class="bodysection">

      <a href="/">

    </header>

    <nav id="mainButtons">

      {{end}}

    <footer>
      <a href = "/assets/terms.html"><p>{{.Footer_terms}}</p></a>
    </footer>
    
  </section>
</body>

</html>
