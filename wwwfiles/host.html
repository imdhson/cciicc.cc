<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{.Host_detail}} - {{.Service_name}}</title>
  <style>
    @import url('/assets/main.css');
  </style>
</head>

<body>
  <section class="bodysection">
    <header>
      <a href="/">
        <h1>{{.Service_name}}</h1>
      </a>
    </header>
    <main>
      <h3>{{.Host_detail}}</h3>
    </main>

    <form action="/space/create" method="post">
      {{.CsrfField}}
      <label for="large_input">{{.Host_spacename}}</label>
      <input type="text" id="large_input" name="spaceName" placeholder="{{.Host_spacename_input}}">

      <label for="userName">{{.Host_username}}</label>
      <input type="text" id="userName" name="userName" placeholder="{{.Host_username_input}}">
      <button type="submit">{{.Host_form_button}}</button>
    </form>

    <footer>
      <a href="/assets/terms.html">
        <p>{{.Footer_terms}}</p>
      </a>
    </footer>
    
  </section>
</body>

</html>
